name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    # GITHUB_TOKEN cannot create a Pages site via configure-pages
    # ("Resource not accessible by integration"), so we deploy to the
    # gh-pages branch instead — GitHub enables Pages for that branch
    # automatically on first push.
    if: github.repository == 'tzone85/wealth-pulse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_OUTPUT: export
          BASE_PATH: /wealth-pulse

      - name: Push to gh-pages branch
        run: |
          cd out
          # Without .nojekyll, Pages' Jekyll pipeline drops the _next/ dir.
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
