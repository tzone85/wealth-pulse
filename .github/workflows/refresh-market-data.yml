name: Refresh market data

on:
  schedule:
    # Weekdays at 07:15 and 17:15 SAST (05:15 / 15:15 UTC).
    # NOTE: scheduled runs only fire from the default branch (main).
    - cron: '15 5 * * 1-5'
    - cron: '15 15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-market-data
  cancel-in-progress: false

jobs:
  refresh:
    # Don't run the cron on forks.
    if: github.repository == 'tzone85/wealth-pulse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest market data
        run: node scripts/refresh-market-data.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/market-snapshot.json
          if git diff --staged --quiet; then
            echo "No changes — snapshot already up to date."
          else
            git commit -m "chore: refresh market data snapshots"
            git push
          fi
